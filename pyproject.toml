[project]
name = "mtg-drafting"
version = "0.1.0"
description = "Simulate MTG cube drafts with a local Ollama LLM playing every seat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "requests",
    "httpx",
    "rich",
    "typer",
    "tqdm",
    "ollama",
]

[project.scripts]
mtg-draft = "mtg_drafting.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_drafting"]

# --- pixi ----------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

# Conda-forge provides these; ollama is left to pypi (see project.dependencies).
[tool.pixi.dependencies]
python = "3.12.*"
pydantic = ">=2"
requests = "*"
httpx = "*"
rich = "*"
typer = "*"
tqdm = "*"

[tool.pixi.pypi-dependencies]
mtg-drafting = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"
ipython = "*"

[tool.pixi.feature.notebook.dependencies]
jupyterlab = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
notebook = { features = ["dev", "notebook"], solve-group = "default" }

[tool.pixi.tasks]
draft = "python -m mtg_drafting.cli draft"
evaluate = "python -m mtg_drafting.cli evaluate"
test = "pytest -q"
lint = "ruff check src tests"

# --- tooling -------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
